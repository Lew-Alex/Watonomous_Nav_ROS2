control_node:
  ros__parameters:
    control_period_ms: 100   # how often a new velocity command is computed
    arrival_tolerance: 0.5   # metres to the last path pose that counts as arrived
    look_ahead_dis: 2.0      # metres ahead along the path to aim at
    speed_gain: 1.5          # metres per second per metre to the lookahead point
    min_speed: 0.75          # metres per second
    max_speed: 3.0           # metres per second

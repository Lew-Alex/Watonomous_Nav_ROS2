map_memory_node:
  ros__parameters:
    resolution: 0.25          # metres per cell // ***
    width_cells: 120          # 120 cells at 0.25 m is 30 m // ***
    height_cells: 120         # // ***
    origin_x: -15.0           # world coordinate of cell (0,0)
    origin_y: -15.0
    update_period_seconds: 1  # how often the global map is republished
    move_threshold: 1.5       # metres of travel before integrating a new scan
